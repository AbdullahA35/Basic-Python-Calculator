[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# --dist loadfile: with "-n auto" every test file runs on one worker, so the
# order inside a file (pytest-order) is kept. Has no effect on a serial run.
addopts = -ra --strict-markers --dist loadfile
markers =
    smoke: fast sanity checks, run first
    unit: unit tests for calculator functions and the Calculator class
    addition: addition suite
    subtraction: subtraction suite
    multiplication: multiplication suite
    division: division suite
    method: tests of the Calculator class methods
    class_level: tests of the Calculator class as a whole (state, history)
    workflow: ordered, stateful session tests
    csvdata: tests driven by external CSV data
    excel: tests driven by the Excel test-case workbook
    ahmed: tests written by Ahmed Sufian
    abdullah: tests written by Abdullah Amir
